<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>샘플 체험 | 나의 절주관리센터 (ARS)</title><link rel="stylesheet" href="portal.css?v=20261115-125"><style>
:root{font-family:Arial,'Noto Sans KR',sans-serif;color:#142C50;background:#f6f8fb}*{box-sizing:border-box}body{margin:0}button,a{font:inherit}a{color:inherit}.demo-top{background:#f7f9fc;border-bottom:1px solid #d7dfea;padding:13px max(20px,5vw);display:flex;align-items:center;justify-content:space-between;gap:10px}.demo-top strong{font-size:18px}.demo-top a,.demo-actions a{border:1px solid #d0dff1;border-radius:7px;padding:9px 13px;text-decoration:none;background:white;font-size:13px;font-weight:700}.demo-banner{padding:22px max(20px,5vw);background:#fff;border-bottom:1px solid #d7dfea}.demo-banner h1{margin:0 0 7px;font-size:27px}.demo-banner p{margin:0;color:#66788c;font-size:14px}.demo-pill{background:#d7dfea;border-radius:5px;padding:4px 8px;font-size:11px;font-weight:800;margin-left:8px}.demo-nav{display:grid;grid-template-columns:repeat(3,1fr);background:#192f53}.demo-nav button{border:0;background:none;color:white;padding:15px;cursor:pointer;font-weight:800}.demo-nav button.active{background:#496596;border-bottom:4px solid #b52d48}.demo-wrap{max-width:1300px;margin:22px auto;padding:0 18px}.demo-card{background:white;border:1px solid #d7dfea;border-radius:8px;padding:22px;margin-bottom:16px}.demo-card h2{font-size:22px;margin:0 0 18px;padding-bottom:15px;border-bottom:1px solid #d7dfea}.demo-card h2:before{content:'';display:inline-block;width:6px;height:25px;background:#b52d48;border-radius:4px;margin-right:13px;vertical-align:-5px}.demo-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.demo-metric{border:1px solid #d7dfea;background:#f7f8fa;padding:20px;text-align:center;border-radius:7px}.demo-metric b{display:block;font-size:32px;margin-top:7px}.demo-metric span{color:#66788c;font-size:13px}.demo-month{display:flex;justify-content:center;align-items:center;gap:18px;margin:20px 0}.demo-month button{background:white;border:1px solid #d0dff1;border-radius:6px;cursor:pointer;padding:6px 12px;color:#142C50}.demo-month strong{font-size:22px}.demo-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.demo-week{text-align:center;font-size:13px;color:#66788c;padding:9px}.demo-day{min-height:93px;border:1px solid #d7dfea;background:#f7f8fa;padding:9px;text-align:left;color:#142C50;cursor:pointer;border-radius:3px}.demo-day b{display:block;margin-bottom:9px}.demo-day small{display:block;font-size:12px;padding:5px 6px;background:#d3e0f3}.demo-day.drink{background:#fff}.demo-day.drink small{background:#e3f1ec}.demo-day.selected{outline:2px solid #142C50}.demo-day:disabled{cursor:default;opacity:.65}.demo-detail{background:#f7f8fa;border:1px solid #d7dfea;border-radius:6px;padding:16px;margin-top:16px;min-height:70px}.demo-bars{display:grid;gap:18px}.demo-bar-label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}.demo-bar{height:26px;background:#d7dfea;border-radius:5px;overflow:hidden;display:flex}.demo-bar i{display:block;background:#b52d48}.demo-bar i.dry{background:#496596}.demo-actions{display:flex;justify-content:flex-end;margin:20px 0}.demo-note{color:#66788c;font-size:13px}.demo-hidden{display:none!important}@media(max-width:650px){.demo-metrics{gap:6px}.demo-metric{padding:12px 5px}.demo-metric b{font-size:24px}.demo-day{min-height:63px;padding:5px}.demo-day small{font-size:10px;padding:2px}.demo-banner h1{font-size:22px}}
</style></head><body>
<header class="demo-top"><strong>◉ 절주관리청 <span class="demo-pill">샘플 체험</span></strong><a href="index.html">실제 서비스로 이동 →</a></header>
<section class="demo-banner"><h1>나의 절주관리센터 (ARS)</h1><p>가상 기록으로 둘러보는 절주 현황 · 데이터는 저장되지 않으며 실제 계정과 연결되지 않습니다.</p></section>
<nav class="demo-nav"><button data-tab="home" class="active">홈</button><button data-tab="records">음주 기록</button><button data-tab="analytics">통계 분석</button></nav>
<main class="demo-wrap">
<section data-panel="home"><div class="demo-card"><h2>절주 현황 (2026년 11월)</h2><div class="demo-metrics" id="homeMetrics"></div></div><div class="demo-card"><h2>월별 금주 현황</h2><div id="homeBars" class="demo-bars"></div></div></section>
<section data-panel="records" class="demo-hidden"><div class="demo-card"><h2>월간 음주 신고 현황</h2><div class="demo-month"><button id="prevMonth" aria-label="이전 달">❮</button><strong id="monthTitle">2026년 11월</strong><button id="nextMonth" aria-label="다음 달">❯</button></div><div class="demo-calendar" id="calendar"></div><div class="demo-detail" id="detail">날짜를 선택하면 신고 내역을 볼 수 있습니다.</div></div></section>
<section data-panel="analytics" class="demo-hidden"><div class="demo-card"><h2>음주 동향 분석 보고</h2><p class="demo-note">2026년 9월 1일 ~ 11월 15일 · 가상 신고 기록 기준</p><div class="demo-metrics" id="analyticsMetrics"></div></div><div class="demo-card"><h2>월별 음주 빈도 분석</h2><div id="analyticsBars" class="demo-bars"></div></div></section>
<div class="demo-actions"><a href="index.html">내 기록 시작하기 →</a></div><p class="demo-note">ARS 2026 · 샘플 체험판 · 실제 정부기관과 관련 없는 가상 서비스입니다.</p></main>
<script>
(async()=>{
 const response=await fetch('demo-data.json',{cache:'no-store'});if(!response.ok)throw Error('샘플 데이터 로드 실패');const days=(await response.json()).days;
 const $=id=>document.getElementById(id),months=[9,10,11];let month=11,selected=null;
 const names={beer:'맥주',wine:'와인',soju:'소주',liquor:'위스키·칵테일',other:'기타'};
 const units={smallcan:'작캔',largecan:'큰캔',shot:'잔',glass:'잔',half:'반병',bottle:'병'};
 const stats=m=>{let entries=Object.entries(days).filter(([date])=>Number(date.slice(5,7))===m);return {total:entries.length,dry:entries.filter(([,v])=>v.status==='dry').length,drink:entries.filter(([,v])=>v.status==='drink').length}};
 const metric=(label,n)=>'<div class="demo-metric"><span>'+label+'</span><b>'+n+'</b></div>';
 const bars=()=>months.map(m=>{const s=stats(m);return '<div><div class="demo-bar-label"><strong>2026년 '+m+'월</strong><span>음주 '+s.drink+'일 · 금주 '+s.dry+'일</span></div><div class="demo-bar"><i style="width:'+(s.drink/s.total*100)+'%"></i><i class="dry" style="width:'+(s.dry/s.total*100)+'%"></i></div></div>'}).join('');
 const nov=stats(11);$('homeMetrics').innerHTML=metric('11월 금주일수',nov.dry+'일')+metric('11월 음주일수',nov.drink+'일')+metric('기록된 날짜',nov.total+'일');$('homeBars').innerHTML=bars();$('analyticsBars').innerHTML=bars();
 const all=Object.values(days);$('analyticsMetrics').innerHTML=metric('전체 기록일',all.length+'일')+metric('음주일',all.filter(x=>x.status==='drink').length+'일')+metric('금주일',all.filter(x=>x.status==='dry').length+'일');
 function draw(){
  $('monthTitle').textContent='2026년 '+month+'월';$('prevMonth').disabled=month===9;$('nextMonth').disabled=month===11;
  const first=new Date(2026,month-1,1).getDay(),total=month===11?15:new Date(2026,month,0).getDate();let html=['일','월','화','수','목','금','토'].map(w=>'<div class="demo-week">'+w+'</div>').join('');
  for(let i=0;i<first;i++)html+='<span></span>';
  for(let i=1;i<=new Date(2026,month,0).getDate();i++){let date='2026-'+String(month).padStart(2,'0')+'-'+String(i).padStart(2,'0'),v=days[date];html+='<button class="demo-day '+(v?.status||'')+(selected===date?' selected':'')+'" data-date="'+date+'" '+(!v?'disabled':'')+'><b>'+i+'</b>'+(v?'<small>'+(v.status==='dry'?'✓ 금주':'🍺 음주')+'</small>':'<small>미기록</small>')+'</button>'}
  $('calendar').innerHTML=html;
  $('calendar').querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selected=b.dataset.date;showDetail();draw()});
  if(selected&&Number(selected.slice(5,7))!==month)selected=null;
  showDetail();
 }
 function showDetail(){if(!selected){$('detail').textContent='날짜를 선택하면 신고 내역을 볼 수 있습니다.';return}const v=days[selected];if(!v){$('detail').textContent='미기록 날짜입니다.';return}if(v.status==='dry'){$('detail').textContent=selected+' · 금주';return}
 const parts=v.sessions.map((session,i)=>'음주 회차 '+(i+1)+' · '+(session.company==='solo'?'혼술':'술자리')+' · '+session.drinks.map(d=>(names[d.type]||d.type)+' '+(units[d.unit]||d.unit)+' ×'+d.qty).join(', '));
 $('detail').textContent=selected+' · '+parts.join(' / ');
 }
 $('prevMonth').onclick=()=>{month--;selected=null;draw()};$('nextMonth').onclick=()=>{month++;selected=null;draw()};draw();
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('[data-panel]').forEach(x=>x.classList.toggle('demo-hidden',x.dataset.panel!==b.dataset.tab))});
})().catch(err=>{document.querySelector('.demo-wrap').textContent='샘플 데이터를 불러오지 못했습니다: '+err.message});
</script></body></html>
